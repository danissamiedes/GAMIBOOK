# Nightly backup of the books.
#
# Supabase's free plan does not take automated backups you can download, so
# without this the only copy of the ledger is the live database. This dumps it
# and puts the dump in a Supabase Storage bucket — a different service from the
# database, which is the part that makes it a backup.
#
# Repository secrets — Settings → Secrets and variables → Actions:
#   SUPABASE_DB_URL              the SESSION POOLER string, port 5432. Not the
#                                transaction pooler (6543), which will not hold
#                                the session pg_dump needs; and not the direct
#                                connection, which Supabase serves over IPv6
#                                only unless you pay for the IPv4 add-on —
#                                GitHub's runners have no IPv6.
#   SUPABASE_S3_ENDPOINT         https://<project-ref>.storage.supabase.co/storage/v1/s3
#   SUPABASE_S3_REGION           the project's region, e.g. ap-southeast-1
#   SUPABASE_S3_ACCESS_KEY_ID    from Storage → S3 access keys
#   SUPABASE_S3_SECRET_ACCESS_KEY
#   BACKUP_BUCKET                a bucket kept PRIVATE, e.g. ledger-backups
#
# Restoring is in README.md. Test it before you need it: a backup nobody has
# restored is a hypothesis.
name: Backup

on:
  schedule:
    # 18:20 UTC is 02:20 in Manila — after the day's work, before the morning's.
    - cron: "20 18 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          # All six up front, before the job spends a minute installing a
          # client and dumping the database only to find it has nowhere to put
          # the result. A missing secret is one line to fix; it should not
          # cost a round trip through the database to learn which one.
          MISSING=""
          for NAME in SUPABASE_DB_URL SUPABASE_S3_ENDPOINT SUPABASE_S3_REGION \
                      SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY \
                      BACKUP_BUCKET; do
            [ -n "${!NAME:-}" ] || MISSING="${MISSING} ${NAME}"
          done
          if [ -n "${MISSING}" ]; then
            echo "::error::Missing repository secrets:${MISSING} — Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Caught here rather than as a confusing dump failure: the
          # transaction pooler cannot hold the session pg_dump needs.
          case "${SUPABASE_DB_URL}" in
            *:6543/*) echo "::error::That is the transaction pooler. Use the session pooler on port 5432."; exit 1 ;;
          esac

          echo "All six secrets are set."

      - name: Install a matching pg_dump
        run: |
          set -euo pipefail
          # The runner's client is older than Supabase's server, and pg_dump
          # refuses to dump a newer server than itself. Take it from PGDG.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # Installing 17 is not the same as using it. /usr/bin/pg_dump is
          # postgresql-common's wrapper, and it resolves to the version of the
          # cluster it finds running — the image's PostgreSQL 16 — rather than
          # the newest client on the machine. The versioned directory has to go
          # on PATH ahead of it.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:${PATH}"

          # Assert it here, because the failure this step exists to prevent is
          # otherwise silent: an older client only refuses at dump time, against
          # the live database, at 02:20.
          pg_dump --version
          MAJOR=$(pg_dump --version | awk '{print $3}' | cut -d. -f1)
          if [ "${MAJOR}" -lt 17 ]; then
            echo "::error::pg_dump is version ${MAJOR}, not 17 — PATH did not take."
            exit 1
          fi

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Both this and the pooler port were checked in the first step.
          STAMP=$(date -u +%F)
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

          # -Fc is the custom format: compressed, and pg_restore can be
          # selective with it. --no-owner because the roles on the machine you
          # restore to will not be Supabase's.
          pg_dump --no-owner --no-privileges -Fc \
            --file="ledger-${STAMP}.dump" "${SUPABASE_DB_URL}"

          SIZE=$(stat -c%s "ledger-${STAMP}.dump")
          echo "Dump is ${SIZE} bytes."
          # A dump of an empty or half-connected database is small. Refuse to
          # ship one over a good backup rather than discover it at restore time.
          if [ "${SIZE}" -lt 20000 ]; then
            echo "::error::Dump is only ${SIZE} bytes — that is not a real database. Not uploading."
            exit 1
          fi

      - name: Check it can be read back
        run: |
          set -euo pipefail
          # Not a restore, but it parses the whole archive and lists its
          # contents, which catches a truncated or corrupt file here rather
          # than on the day you need it.
          pg_restore --list "ledger-${STAMP}.dump" > /dev/null
          echo "Archive reads cleanly."

      - name: Upload to Supabase Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "ledger-${STAMP}.dump" "s3://${BUCKET}/ledger-${STAMP}.dump" \
            --endpoint-url "${ENDPOINT}"
          echo "Uploaded ledger-${STAMP}.dump"

      - name: Drop dumps older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '30 days ago' +%F)
          echo "Keeping anything from ${CUTOFF} onwards."

          # The date is in the key, so no metadata call is needed to judge age.
          # The `|| true` matters on the first run: grep exits 1 when the bucket
          # is empty, which under `set -o pipefail` would fail the whole step
          # for having nothing to tidy.
          aws s3 ls "s3://${BUCKET}/" --endpoint-url "${ENDPOINT}" \
            | awk '{print $4}' \
            | { grep -E '^ledger-[0-9]{4}-[0-9]{2}-[0-9]{2}\.dump$' || true; } \
            | while read -r key; do
                day="${key#ledger-}"; day="${day%.dump}"
                if [[ "${day}" < "${CUTOFF}" ]]; then
                  echo "Removing ${key}"
                  aws s3 rm "s3://${BUCKET}/${key}" --endpoint-url "${ENDPOINT}"
                fi
              done
        shell: bash
